<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pliki - {{TITLE}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;color:#333;padding:16px;}
.breadcrumb{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;font-size:14px;}
.breadcrumb a{color:#1976d2;text-decoration:none;}.breadcrumb a:hover{text-decoration:underline;}
.breadcrumb span{color:#666;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-folder-dl{padding:6px 14px;background:#43a047;color:white;border-radius:4px;text-decoration:none;font-size:13px;font-weight:500;}
.btn-folder-dl:hover{background:#388e3c;}
.btn-selected{padding:6px 14px;background:#1976d2;color:white;border-radius:4px;border:none;font-size:13px;font-weight:500;cursor:pointer;display:none;}
.btn-selected:hover{background:#1565c0;}
.btn-selected.visible{display:inline-block;}
.select-all-wrap{font-size:13px;color:#666;display:flex;align-items:center;gap:4px;}
.select-all-wrap input{margin:0;}
/* Search */
.search-wrap{margin-bottom:12px;}
.search-wrap input{width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none;transition:border-color 0.2s;}
.search-wrap input:focus{border-color:#1976d2;}
/* Stats bar */
.stats{font-size:12px;color:#888;margin-bottom:8px;}
.file-list{list-style:none;}
.file-item{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #e0e0e0;background:white;transition:background 0.1s;}
.file-item:first-child{border-radius:8px 8px 0 0;}.file-item:last-child{border-radius:0 0 8px 8px;border-bottom:none;}
.file-item:only-child{border-radius:8px;}.file-item:hover{background:#e3f2fd;}
.file-item.checked{background:#e8f5e9;}
.file-item.hidden{display:none;}
.file-cb{margin-right:10px;width:16px;height:16px;cursor:pointer;flex-shrink:0;}
.file-icon{font-size:20px;margin-right:12px;flex-shrink:0;}
.file-name{flex:1;min-width:0;}.file-name a{color:#333;text-decoration:none;font-weight:500;cursor:pointer;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.file-name a:hover{color:#1976d2;}
.file-desc{display:block;font-size:12px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.file-info{color:#666;font-size:13px;margin-left:12px;white-space:nowrap;}
.btn-sm{margin-left:8px;padding:4px 8px;background:#e0e0e0;border-radius:4px;text-decoration:none;font-size:12px;color:#333;flex-shrink:0;}.btn-sm:hover{background:#bdbdbd;}
.btn-del{background:#ffebee !important;color:#c62828 !important;border:none;cursor:pointer;}.btn-del:hover{background:#ffcdd2 !important;}
/* Upload */
.upload-section{margin-top:24px;padding:20px;background:white;border-radius:8px;border:2px dashed #ccc;transition:border-color 0.2s;}
.upload-section.dragover{border-color:#1976d2;background:#e3f2fd;}
.upload-section h3{margin-bottom:12px;font-size:16px;}
@media(max-width:600px){.upload-section [style*="grid"]{grid-template-columns:1fr !important;}.upload-section [style*="border-left"]{border-left:none !important;padding-left:0 !important;border-top:1px solid #e0e0e0;padding-top:16px;margin-top:16px;}}
.upload-form{display:flex;flex-direction:column;gap:10px;}
.upload-form input[type="file"]{padding:8px;}.upload-form input[type="text"]{padding:8px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;}
.upload-form button{padding:10px 20px;background:#1976d2;color:white;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-weight:500;}.upload-form button:hover{background:#1565c0;}
.msg{padding:12px;border-radius:4px;margin-bottom:16px;animation:fadeIn 0.3s;}.msg-success{background:#e8f5e9;color:#2e7d32;}
.empty{text-align:center;padding:40px;color:#666;}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;}
.modal-overlay.active{display:flex;}
.modal{background:white;border-radius:12px;width:92%;max-width:950px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.3);animation:modalIn 0.2s;}
.modal-header{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #e0e0e0;gap:4px;}
.modal-header h3{font-size:15px;word-break:break-all;flex:1;text-align:center;margin:0 8px;}
.modal-actions{display:flex;gap:6px;align-items:center;}
.btn-dl{padding:5px 10px;background:#1976d2;color:white;border-radius:4px;text-decoration:none;font-size:12px;}.btn-dl:hover{background:#1565c0;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#666;padding:2px 6px;}.modal-close:hover{color:#333;}
.nav-btn{background:none;border:none;font-size:28px;cursor:pointer;color:#555;padding:2px 10px;flex-shrink:0;}.nav-btn:hover{color:#1976d2;}.nav-btn:disabled{color:#ccc;cursor:default;}
.modal-body{flex:1;overflow:auto;padding:16px;min-height:200px;}
.modal-body iframe{width:100%;height:70vh;border:none;}
.modal-body img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:4px;}
.modal-body pre{background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:8px;overflow:auto;max-height:70vh;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;}
.modal-footer{padding:6px 16px;border-top:1px solid #e0e0e0;text-align:center;font-size:12px;color:#888;}
.no-preview{text-align:center;padding:60px;color:#666;}
/* Pending items */
.pending-group{background:#fff3e0 !important;border-left:3px solid #ff9800;flex-direction:column;align-items:stretch !important;padding:0 !important;}
.pending-group>details,.pending-group>.pending-header{width:100%;padding:10px 12px;}
.pending-header{display:flex;align-items:center;cursor:pointer;width:100%;list-style:none;gap:8px;}
summary.pending-header::-webkit-details-marker{display:none;}
summary.pending-header::before{content:'▶';font-size:10px;color:#ff9800;transition:transform 0.2s;flex-shrink:0;}
details[open]>summary.pending-header::before{transform:rotate(90deg);}
.pending-actions{margin-left:auto;display:flex;gap:4px;flex-shrink:0;}
.pending-btn{padding:3px 8px;border:none;border-radius:4px;font-size:11px;cursor:pointer;font-weight:500;}
.pending-btn.approve{background:#4caf50;color:white;}.pending-btn.approve:hover{background:#388e3c;}
.pending-btn.reject{background:#f44336;color:white;}.pending-btn.reject:hover{background:#d32f2f;}
.pending-files{list-style:none;margin:0;padding:0 12px 8px 12px;border-top:1px solid #ffe0b2;}
.pending-file{background:#fff8e1 !important;border-bottom:1px solid #ffe0b2 !important;border-radius:0 !important;}
.pending-file:last-child{border-bottom:none !important;}
.pending-file-actions{display:flex;gap:4px;margin-left:8px;flex-shrink:0;}
.pending-file-actions form{display:inline;}
.pending-file-actions .pending-btn{padding:4px 8px;font-size:12px;}
/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{transform:scale(0.95);opacity:0}to{transform:scale(1);opacity:1}}
/* Tooltip */
[title]{position:relative;}
/* Back to top */
.back-to-top{position:fixed;bottom:20px;right:20px;width:40px;height:40px;background:#1976d2;color:white;border:none;border-radius:50%;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);z-index:500;}
.back-to-top.visible{display:flex;}
.back-to-top:hover{background:#1565c0;}
</style>
</head><body>
<div class="breadcrumb">{{BREADCRUMB}}</div>

<!-- Search -->
<div class="search-wrap">
<input type="text" id="searchInput" placeholder="🔍 Szukaj plików..." oninput="filterFiles()">
</div>

<!-- Stats -->
<div class="stats" id="statsBar">{{STATS}}</div>

<div class="toolbar">
<div class="select-all-wrap"><input type="checkbox" id="selectAll" onchange="toggleAll(this.checked)"><label for="selectAll">Zaznacz wszystkie</label></div>
<div class="toolbar-right">
<button class="btn-selected" id="dlSelectedBtn" onclick="downloadSelected()">⬇ Pobierz zaznaczone (<span id="selectedCount">0</span>)</button>
{{TOOLBAR}}
</div>
</div>
{{MSG}}
<ul class="file-list" id="fileList">{{ITEMS}}</ul>

<div class="upload-section" id="uploadSection">
<div style="display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;">
<div>
<h3>📤 Wrzuć pliki</h3>
<form class="upload-form" id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
<input type="hidden" name="target_path" value="{{PATH}}">
<input type="file" name="file" id="fileInput" multiple required onchange="validateFiles(this)">
<input type="text" name="uploader" placeholder="Twoje imię/nick (opcjonalne)">
<button type="submit">Wyślij do zatwierdzenia</button>
</form>
<p style="margin-top:8px;font-size:12px;color:#666;">Maks. 10 plików, 10 MB/plik. Pojawią się po zatwierdzeniu.<br>
Możesz też dodać przez <a href="{{GITHUB_PR_URL}}" target="_blank">Pull Request</a>.</p>
</div>
<div style="border-left:1px solid #e0e0e0;padding-left:24px;">
<h3>📁 Nowy folder</h3>
<form class="upload-form" action="/create-folder" method="post">
<input type="hidden" name="target_path" value="{{PATH}}">
<input type="text" name="folder_name" placeholder="Nazwa folderu" required style="width:180px;">
<button type="submit" style="background:#43a047;">Utwórz folder</button>
</form>
</div>
</div>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal">
<div class="modal">
<div class="modal-header">
<button class="nav-btn" id="prevBtn" onclick="nav(-1)" title="Poprzedni (←)">&#8249;</button>
<h3 id="modalTitle"></h3>
<div class="modal-actions">
<a id="modalDownload" href="#" class="btn-dl">⬇ Pobierz</a>
<button class="modal-close" onclick="closePreview()">✕</button>
</div>
<button class="nav-btn" id="nextBtn" onclick="nav(1)" title="Następny (→)">&#8250;</button>
</div>
<div class="modal-body" id="modalBody"></div>
<div class="modal-footer" id="modalFooter"></div>
</div>
</div>

<!-- Back to top -->
<button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const FILES = {{FILES_JSON}};
const ALL_FILES = {{ALL_FILES_JSON}};
let idx = -1;

// === Search / Filter ===
function filterFiles() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const items = document.querySelectorAll('.file-item');
    let visible = 0;
    items.forEach(li => {
        const name = li.querySelector('.file-name a').textContent.toLowerCase();
        const match = !q || name.includes(q);
        li.classList.toggle('hidden', !match);
        if (match) visible++;
    });
    document.getElementById('statsBar').textContent = q ? `Wyniki: ${visible} z ${items.length}` : `{{STATS}}`;
}

// === Preview Modal ===
function openPreview(i) {
    idx = i; render();
    document.getElementById('previewModal').classList.add('active');
}
function render() {
    const f = FILES[idx];
    document.getElementById('modalTitle').textContent = f.name;
    document.getElementById('modalDownload').href = f.dl;
    document.getElementById('prevBtn').disabled = idx <= 0;
    document.getElementById('nextBtn').disabled = idx >= FILES.length - 1;
    document.getElementById('modalFooter').textContent = (idx+1) + ' / ' + FILES.length;
    const body = document.getElementById('modalBody');
    const imgExts = ['.jpg','.jpeg','.png','.gif','.bmp','.webp','.svg'];
    if (['.pdf'].includes(f.ext)) { body.innerHTML = '<iframe src="' + f.view + '"></iframe>'; }
    else if (imgExts.includes(f.ext)) { body.innerHTML = '<img src="' + f.view + '">'; }
    else {
        body.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">Ładowanie...</div>';
        fetch(f.view).then(r => r.text()).then(text => {
            const pre = document.createElement('pre');
            pre.textContent = text.substring(0, 50000);
            body.innerHTML = ''; body.appendChild(pre);
        }).catch(() => { body.innerHTML = '<div class="no-preview">Brak podglądu.</div>'; });
    }
}
function nav(dir) { const ni = idx+dir; if (ni>=0 && ni<FILES.length) { idx=ni; render(); } }
function closePreview() {
    document.getElementById('previewModal').classList.remove('active');
    document.getElementById('modalBody').innerHTML = ''; idx = -1;
    document.getElementById('prevBtn').style.display = '';
    document.getElementById('nextBtn').style.display = '';
}
document.getElementById('previewModal').addEventListener('click', function(e) { if (e.target===this) closePreview(); });
document.addEventListener('keydown', function(e) {
    if (!document.getElementById('previewModal').classList.contains('active')) return;
    if (e.key==='Escape') closePreview();
    else if (e.key==='ArrowLeft') nav(-1);
    else if (e.key==='ArrowRight') nav(1);
});

// === Checkboxes / Download Selected ===
function updateSelectedCount() {
    const checked = document.querySelectorAll('.file-cb:checked');
    const count = checked.length;
    document.getElementById('selectedCount').textContent = count;
    document.getElementById('dlSelectedBtn').classList.toggle('visible', count > 0);
    document.querySelectorAll('.file-item').forEach(li => li.classList.remove('checked'));
    checked.forEach(cb => cb.closest('.file-item').classList.add('checked'));
}
function toggleAll(state) {
    document.querySelectorAll('.file-cb').forEach(cb => { cb.checked = state; });
    updateSelectedCount();
}
function downloadSelected() {
    const checked = document.querySelectorAll('.file-cb:checked');
    const paths = [];
    checked.forEach(cb => paths.push(cb.dataset.rel));
    if (paths.length === 0) return;
    const form = document.createElement('form');
    form.method = 'POST'; form.action = '/download-selected';
    paths.forEach(p => {
        const input = document.createElement('input');
        input.type = 'hidden'; input.name = 'files'; input.value = p;
        form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
}

// === File validation ===
function validateFiles(input) {
    if (input.files.length > 10) {
        alert('Maksymalnie 10 plików na raz!');
        input.value = '';
        return;
    }
    for (const f of input.files) {
        if (f.size > 10485760) {
            alert('Plik "' + f.name + '" jest za duży! Maks. 10 MB na plik.');
            input.value = '';
            return;
        }
    }
}

// === Drag & Drop upload ===
const uploadSection = document.getElementById('uploadSection');
['dragenter','dragover'].forEach(ev => {
    uploadSection.addEventListener(ev, e => { e.preventDefault(); uploadSection.classList.add('dragover'); });
});
['dragleave','drop'].forEach(ev => {
    uploadSection.addEventListener(ev, e => { e.preventDefault(); uploadSection.classList.remove('dragover'); });
});
uploadSection.addEventListener('drop', e => {
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        const fileInput = document.getElementById('fileInput');
        fileInput.files = files;
        validateFile(fileInput);
    }
});

// === Back to top button ===
window.addEventListener('scroll', () => {
    document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 300);
});

// === Keyboard shortcut: Ctrl+F focuses search ===
document.addEventListener('keydown', function(e) {
    if (document.getElementById('previewModal').classList.contains('active')) return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
    }
});

// === Init ===
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.file-cb').forEach(cb => cb.addEventListener('change', updateSelectedCount));
    // Auto-dismiss success message after 5s
    const msg = document.querySelector('.msg-success');
    if (msg) setTimeout(() => { msg.style.opacity = '0'; setTimeout(() => msg.remove(), 300); }, 5000);
});

// === Pending file preview (admin) ===
function openPendingPreview(viewUrl, name, ext) {
    document.getElementById('modalTitle').textContent = name;
    document.getElementById('modalDownload').href = viewUrl;
    const body = document.getElementById('modalBody');
    const imgExts = ['.jpg','.jpeg','.png','.gif','.bmp','.webp','.svg'];
    if (['.pdf'].includes(ext)) { body.innerHTML = '<iframe src="' + viewUrl + '"></iframe>'; }
    else if (imgExts.includes(ext)) { body.innerHTML = '<img src="' + viewUrl + '">'; }
    else {
        body.innerHTML = '<div style="text-align:center;padding:20px;color:#999;">Ładowanie...</div>';
        fetch(viewUrl).then(r => r.text()).then(text => {
            const pre = document.createElement('pre');
            pre.textContent = text.substring(0, 50000);
            body.innerHTML = ''; body.appendChild(pre);
        }).catch(() => { body.innerHTML = '<div class="no-preview">Brak podglądu.</div>'; });
    }
    document.getElementById('prevBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('modalFooter').textContent = 'Podgląd pliku oczekującego';
    document.getElementById('previewModal').classList.add('active');
}
</script>
</body></html>
